[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dubai-property"
version = "0.5.0"
description = "Azure lakehouse for official Dubai Land Department sales and rental data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Salman Tariq" }]
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "pyyaml>=6.0",  # reads databricks.yml in tests
]
# Local Spark for the bronze tests. Databricks provides its own Spark, so this
# is never installed there. PySpark and Delta versions must match each other.
spark = [
    "pyspark==4.0.1",
    "delta-spark==4.0.0",
]

[project.scripts]
dld-profile = "dubai_property.profiling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "tests"]
markers = [
    "spark: needs a local SparkSession (skipped when PySpark or Java is missing)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# `from pyspark.sql import functions as F` is the PySpark convention
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F821", "E501"]  # Databricks notebooks: spark/dbutils/display are globals
